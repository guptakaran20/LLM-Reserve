name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      # CPU-only torch wheels: the default Linux wheel pulls ~3 GB of CUDA libraries CI never uses.
      - run: pip install -r requirements.txt --extra-index-url https://download.pytorch.org/whl/cpu && pip install -e . --no-deps
      # Tests on data/processed and data/features are skipped here: CI does not download the 600 MB dataset.
      - run: pytest -q
